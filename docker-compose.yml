services:
  db:
    image: mariadb:11.8
    container_name: beaconlab-db
    restart: unless-stopped
    command:
      - --max_allowed_packet=256M
      - --sql_mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-import:
    image: mariadb:11.8
    container_name: beaconlab-db-import
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - ./site/extracted/database.sql:/dump/database.sql:ro
      - ./scripts/import-db.sh:/import-db.sh:ro
    entrypoint: ["bash", "/import-db.sh"]
    depends_on:
      db:
        condition: service_healthy

  wordpress:
    image: wordpress:7.1.2-php8.2-apache
    container_name: beaconlab-wp
    restart: unless-stopped
    ports:
      - "${WP_PORT:-80}:80"
    extra_hosts:
      - "beaconlab.localhost:127.0.0.1"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', '${BEACONLAB_URL:-http://beaconlab.localhost}' );
        define( 'WP_SITEURL', '${BEACONLAB_URL:-http://beaconlab.localhost}' );
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'FORCE_SSL_ADMIN', false );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_MEMORY_LIMIT', '512M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
    volumes:
      - wp_data:/var/www/html
      - ./docker/memory-limit.ini:/usr/local/etc/php/conf.d/zz-memory-limit.ini:ro
      - ./site/extracted/plugins:/var/www/html/wp-content/plugins
      - ./site/extracted/themes:/var/www/html/wp-content/themes
      - ./site/extracted/uploads:/var/www/html/wp-content/uploads
      - ./site/extracted/languages:/var/www/html/wp-content/languages
      - ./site/extracted/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/plugins/wp-ai-translator:/var/www/html/wp-content/plugins/wp-ai-translator
    depends_on:
      db:
        condition: service_healthy
      db-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  wp-setup:
    image: wordpress:cli-php8.2
    container_name: beaconlab-wp-setup
    restart: "no"
    user: "0:0"
    extra_hosts:
      - "beaconlab.localhost:127.0.0.1"
    environment:
      BEACONLAB_URL: ${BEACONLAB_URL:-http://beaconlab.localhost}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ./site/extracted/plugins:/var/www/html/wp-content/plugins
      - ./site/extracted/themes:/var/www/html/wp-content/themes
      - ./site/extracted/uploads:/var/www/html/wp-content/uploads
      - ./site/extracted/languages:/var/www/html/wp-content/languages
      - ./site/extracted/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./site/extracted/package.json:/package.json:ro
      - ./wp-content/plugins/wp-ai-translator:/var/www/html/wp-content/plugins/wp-ai-translator
      - ./docker/memory-limit.ini:/usr/local/etc/php/conf.d/zz-memory-limit.ini:ro
      - ./scripts/setup-wp.sh:/setup-wp.sh:ro
    entrypoint: ["bash", "/setup-wp.sh"]
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  db_data:
  wp_data:
